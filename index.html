<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#14151a;--mute:#8a8d99;--blue:#4f7cff;--line:#e8eaf2;--sh:0 8px 28px rgba(30,40,90,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:480px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:800;margin:6px 4px 16px}
h3{font-size:16px;font-weight:700}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:1/-1}
.mute{color:var(--mute);font-size:13px}
.big{font-size:34px;font-weight:800}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;font-size:14px}
.pill.light{background:#eef0f7;color:var(--ink)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.chip{flex:none;background:#fff;border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:var(--sh)}
.chip.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .4s}
.ex{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ex .ico{width:52px;height:52px;border-radius:18px;background:#eaf0ff;color:var(--blue);display:grid;place-items:center}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 28px));background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(20,30,80,.16);display:flex;justify-content:space-around;align-items:center;padding:10px 8px;z-index:20}
nav button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
nav button.on{color:var(--ink)}
nav .plus{background:var(--ink);color:#fff;width:54px;height:54px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.overlay.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#111216;color:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));z-index:50;transform:translateY(105%);transition:transform .3s;max-width:480px;margin:0 auto}
.sheet.show{transform:none}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:#1d1f27;margin-top:10px;text-align:right}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(0,0,0,.45);padding:20px}
.modal.show{display:grid}
.modal .card{width:100%;max-width:420px}
input[type=text],input[type=password],input[type=number]{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 14px;font:inherit;background:#fafbff;direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;min-height:40vh}
.msg{max-width:85%;padding:12px 15px;border-radius:22px;font-size:14.5px;line-height:1.8;white-space:pre-wrap}
.msg.u{align-self:flex-start;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-end;background:#fff;box-shadow:var(--sh);border-bottom-left-radius:6px}
.msg.t{align-self:center;background:#eaf0ff;color:var(--blue);font-size:12px;padding:6px 12px}
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 28px));display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:8px;box-shadow:var(--sh);z-index:15}
.composer input{border:0;background:none;direction:rtl;text-align:right;padding:8px 10px}
.composer input:focus{outline:0}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eef0f7;flex:none}
.rb.rec{background:#ff4d5e;color:#fff}
.rb.dark{background:var(--ink);color:#fff}
#player{position:fixed;inset:0;background:#000;color:#fff;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(30px + env(safe-area-inset-top)) 24px calc(34px + env(safe-area-inset-bottom));text-align:center}
#player.show{display:flex}
#player .timer{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums}
#player .btn{background:#fff;color:#000;border-radius:999px;padding:16px 34px;font-weight:800;font-size:17px;width:100%;max-width:320px}
.set-dots{display:flex;gap:8px;justify-content:center}
.set-dots i{width:34px;height:6px;border-radius:5px;background:#333}
.set-dots i.on{background:#fff}
.set-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-item:last-child{border:0}
.ico-c{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-90px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:90;transition:transform .3s}
#toast.show{transform:translateX(-50%)}
.typing{opacity:.6}
#splash{position:fixed;inset:0;background:#fff;z-index:200;display:grid;place-items:center;text-align:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash svg{margin:auto;animation:pop .7s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#f4f5f8}
.card{border-radius:34px}
body.dark{--bg:#101116;--card:#1c1d24;--ink:#f3f4f8;--mute:#9a9dab;--line:#2b2d37;--sh:0 8px 24px rgba(0,0,0,.4)}
body.dark .chip,body.dark .msg.a,body.dark .composer{background:var(--card)}
body.dark .rb{background:#2b2d37}
.top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.tp{height:46px;border-radius:999px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;gap:8px;padding:0 18px;font-weight:700;font-size:15px;color:var(--ink)}
.tp.sq{width:46px;padding:0;justify-content:center}.tp.off{opacity:.4}.sp{flex:1}
nav{left:92px;right:14px;transform:none;width:auto;height:64px;background:rgba(236,238,246,.92);backdrop-filter:blur(14px);padding:6px 10px;bottom:calc(14px + env(safe-area-inset-bottom))}
nav button{width:52px;height:52px;color:#b3b6c4}
nav button.on{background:#fff;color:#14151a;box-shadow:0 4px 14px rgba(20,30,80,.12)}
body.dark nav{background:rgba(34,36,46,.92)}body.dark nav button.on{background:#2c2e3a;color:#fff}
.fab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:#16171c;color:#fff;display:grid;place-items:center;z-index:45;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sheet{left:14px;right:auto;margin:0;bottom:calc(96px + env(safe-area-inset-bottom));width:min(330px,calc(100% - 28px));max-width:none;border-radius:34px;padding:10px 12px;background:#1e1f24;transform:translateY(16px) scale(.92);transform-origin:bottom left;opacity:0;pointer-events:none;transition:transform .25s,opacity .2s}
.sheet.show{transform:none;opacity:1;pointer-events:auto}
.sheet .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;margin:0;padding:11px 10px;border-radius:22px;text-align:right}
.opt .tx{display:flex;flex-direction:column}.opt small{color:#9a9dab;font-size:12.5px;margin-top:2px}
.opt .ico{width:46px;height:46px;border-radius:50%;background:#2b2d34;display:grid;place-items:center;flex:none}
@media(min-width:520px){nav{left:calc(50% - 240px + 92px);right:calc(50% - 240px + 14px)}.fab,.sheet{left:calc(50% - 240px + 14px)}}
.fg{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}
.big1{grid-row:1/3;position:relative;min-height:250px;display:flex;flex-direction:column;gap:6px;padding-top:22px}
.big1 svg{position:absolute;bottom:-4px;left:6px}
.num{font-size:44px;font-weight:800;margin:8px 0}.num2{font-size:30px;font-weight:800;margin-top:8px}
.sm{padding:16px 18px;min-height:118px}
.mrow{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.mp{flex:none;min-width:150px;background:var(--card);border-radius:999px;box-shadow:var(--sh);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:150px;padding:16px 18px}
.wfill{position:absolute;left:0;right:0;bottom:0;background:#cfe0ff;opacity:.7}
.ruler{display:flex;justify-content:space-between;align-items:flex-end;height:20px;margin:12px 0 4px}
.ruler i{width:1.5px;background:#c3c6d2}
.s3{display:flex;justify-content:space-around;text-align:center;margin:16px 0}
.s3>div{flex:1;border-left:1px solid var(--line)}.s3>div:last-child{border:0}
.wk{display:flex;justify-content:space-between;margin-top:14px;text-align:center;font-size:14px}
.wk i{display:block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin:6px auto 0}
.park{margin:-18px -16px 14px;height:430px;position:relative;overflow:hidden;background:linear-gradient(#cfe9ff 0,#e8f5ff 38%,#bfe08f 38%,#a9d47b 100%)}
.park::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 16%,#5aa862 0 70px,transparent 71px),radial-gradient(circle at 92% 12%,#6bb96f 0 80px,transparent 81px),radial-gradient(circle at 68% 34%,#7cc27a 0 38px,transparent 39px)}
.park .top{position:relative;padding:14px 16px 0;margin:0}
.park .tp{background:rgba(255,255,255,.6);backdrop-filter:blur(8px);color:#14151a}
.park .mc{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.sw{width:58px;height:34px;border-radius:99px;background:#e1e3ec;position:relative;flex:none;transition:.2s}
.sw i{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}.sw.on i{right:28px}
.pill.blue{background:#0a6be0}
#tour{position:fixed;inset:0;background:rgba(16,18,26,.65);z-index:150;display:none}#tour.show{display:block}
.bub{position:absolute;bottom:285px;background:#fff;color:#14151a;border-radius:30px;padding:20px;width:min(300px,78%)}
.bub.r{right:16px}.bub.l{left:16px}.bub p{margin:6px 0 16px;color:#555;line-height:1.9;font-size:15px}
.bub .dots{display:flex;gap:6px;margin-bottom:12px}.bub .dots i{width:9px;height:9px;border-radius:50%;background:#dcdfe8}.bub .dots i.on{width:30px;border-radius:9px;background:#0a6be0}
.tm{position:absolute;bottom:80px}.tm.r{right:14px}.tm.l{left:14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="composer" id="composer" style="display:none">
  <button class="rb" id="micBtn" aria-label="میکروفن"></button>
  <input type="text" id="chatIn" placeholder="از مربی بپرس یا دستور بده...">
  <button class="rb dark" id="sendBtn" aria-label="ارسال"></button>
</div>
<nav id="nav"></nav><button class="fab" id="fab" data-nav="plus" aria-label="افزودن"></button>
<div class="overlay" id="ov"></div>
<div class="sheet" id="sheet">
  <button class="opt" data-act="log-workout"><span class="tx"><b>ثبت تمرین</b><small id="shRem"></small></span><span class="ico" data-i="dumbbell"></span></button>
  <button class="opt" data-act="video"><span class="tx"><b>ویدیوی تمرین</b><small>ویدیو بفرست، مربی حساب می‌کنه</small></span><span class="ico" data-i="video"></span></button>
  <button class="opt" data-act="food-photo"><span class="tx"><b>ثبت با عکس</b><small>از غذات عکس بگیر</small></span><span class="ico" data-i="camera"></span></button>
  <button class="opt" data-act="food-text"><span class="tx"><b>توضیح غذا</b><small>بنویس چی خوردی</small></span><span class="ico" data-i="edit"></span></button>
  <button class="opt" data-act="log-food"><span class="tx"><b>ثبت دستی غذا</b><small>کالری و ماکروها رو خودت بنویس</small></span><span class="ico" data-i="search"></span></button>
</div>
<div class="modal" id="keyModal"><div class="card stack">
  <h3>کلید API جمینای</h3>
  <p class="mute">کلید فقط در حافظه همین مرورگر (localStorage) ذخیره می‌شود و داخل کد نیست.</p>
  <input type="password" id="keyIn" placeholder="AIza...">
  <div class="row"><button class="pill" id="keySave">ذخیره</button><button class="pill light" id="keyClose">بستن</button></div>
</div></div>
<div class="modal" id="formModal"><div class="card stack" id="formBox"></div></div>
<div id="player"></div>
<div id="tour"></div><div id="toast"></div>
<input type="file" id="vidIn" accept="video/*" hidden>
<input type="file" id="imgIn" accept="image/*" capture="environment" hidden>

<script>
/* ---------- Icons (outline SVG) ---------- */
const P={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
stats:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.2A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
dumbbell:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
apple:'<path d="M12 7c-2-2-6-1-6 4 0 4 2 9 4 9 1 0 1.2-.6 2-.6s1 .6 2 .6c2 0 4-5 4-9 0-5-4-6-6-4z"/><path d="M12 7c0-2 1-3 3-4"/>',
camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 11l5-3v8l-5-3"/>',

target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

x:'<path d="M6 6l12 12M18 6L6 18"/>',

bowl:'<path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 1.500 2 1.500 4M14 4c0 2 1.500 2 1.500 4M9 21h6"/>',
cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
chevR:'<path d="M9 6l6 6-6 6"/>',chevL:'<path d="M15 6l-6 6 6 6"/>',
play:'<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',

};
const I=(n,s)=>`<svg class="ic" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${P[n]}</svg>`;

/* ---------- State ---------- */
const KEY='gravl_state_v1',today=()=>new Date().toISOString().slice(0,10);
const def={date:today(),goal:2200,eaten:0,burned:0,water:0,waterGoal:2500,weight:70,p:0,c:0,f:0,pG:150,cG:250,fG:70,
 foods:[],workouts:[],streak:0,lastActive:'',weekly:0,weeklyGoal:4,fastStart:null,name:'ورزشکار',xp:0,sex:'',age:0,height:0,steps:8500,dark:false,toured:false,muscle:'شکم',chat:[],history:[]};
let S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'));
if(S.date!==today()){S.history=(S.history||[]).concat([{d:S.date,eaten:S.eaten,burned:S.burned,w:S.weight}]).slice(-60);
 Object.assign(S,{date:today(),eaten:0,burned:0,water:0,p:0,c:0,f:0,foods:[]})}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const getKey=()=>localStorage.getItem('gemini_api_key')||'';
const MODEL='gemini-2.5-flash';
let page='food',busy=false;

/* ---------- Data ---------- */
const MUSCLES={
'شکم':[['کرانچ',3,15,6],['پلانک',3,40,5],['بالا آوردن پا',3,12,7],['دوچرخه',3,20,7]],
'سینه':[['شنا',3,12,8],['پرس سینه دمبل',4,10,10],['فلای دمبل',3,12,7]],
'بازو':[['جلو بازو دمبل',3,12,6],['پشت بازو سیم‌کش',3,12,6],['جلو بازو چکشی',3,10,6]],
'پا':[['اسکات',4,12,12],['لانچ',3,12,9],['ددلیفت رومانیایی',3,10,10]],
'شانه':[['پرس شانه',3,10,8],['نشر از جانب',3,15,6]],
'پشت':[['زیربغل دمبل',3,12,8],['بارفیکس',3,8,10]]};
const LV=x=>Math.floor(x/200)+1;

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}

/* ---------- Gemini ---------- */
async function gemini(contents){
 const k=getKey();if(!k)throw new Error('ابتدا کلید API را در پروفایل وارد کن.');
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},
  body:JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents,tools:[{functionDeclarations:DECL}],generationConfig:{temperature:0.1}})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'خطای شبکه');return j.candidates?.[0]?.content||{parts:[{text:'پاسخی دریافت نشد.'}]};
}
async function ask(userParts,label){
 if(busy)return;busy=true;S.chat.push({r:'u',t:label});page='chat';render();
 const hist=S.chat.slice(-12,-1).filter(m=>m.r!=='t').map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]}));
 let contents=[...hist,{role:'user',parts:userParts}];
 try{
  for(let i=0;i<5;i++){
   const out=await gemini(contents);contents.push(out);
   const calls=(out.parts||[]).filter(p=>p.functionCall);
   if(!calls.length){const t=(out.parts||[]).map(p=>p.text||'').join('').trim();S.chat.push({r:'a',t});speak(t);break}
   const res=calls.map(c=>{let r;try{r=TOOLS[c.functionCall.name](c.functionCall.args||{})}catch(e){r={error:String(e)}}
    S.chat.push({r:'t',t:'اجرا شد: '+c.functionCall.name});return{functionResponse:{name:c.functionCall.name,response:r}}});
   contents.push({role:'user',parts:res});
  }
 }catch(e){S.chat.push({r:'a',t:'خطا: '+e.message})}
 busy=false;save();render();
}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
async function sendMedia(file,prompt,label){
 if(file.size>18*1024*1024){toast('حجم فایل بیش از ۱۸ مگابایت است؛ کوتاه‌تر یا فشرده‌تر کن.');return}
 toast('در حال آماده‌سازی فایل...');
 ask([{inlineData:{mimeType:file.type,data:await b64(file)}},{text:prompt}],label);
}
$('#vidIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendMedia(f,'این ویدیوی تمرین است. حرکت را تشخیص بده، ست و تکرار را بشمار، کالری سوخته را تخمین بزن و سپس حتماً با ابزار log_workout ثبتش کن.','ویدیوی تمرین ارسال شد')};
$('#imgIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendMedia(f,'این عکس غذاست. غذا و مقدار را تشخیص بده، کالری و ماکروها را تخمین بزن و با log_food ثبت کن.','عکس غذا ارسال شد')};

/* ---------- Voice ---------- */
function speak(t){if(localStorage.tts==='0'||!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';speechSynthesis.speak(u)}
let rec;
$('#micBtn').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('مرورگر از تشخیص گفتار پشتیبانی نمی‌کند.');return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='fa-IR';rec.interimResults=false;$('#micBtn').classList.add('rec');
 rec.onresult=e=>{const t=e.results[0][0].transcript;ask([{text:t}],t)};
 rec.onend=()=>{rec=null;$('#micBtn').classList.remove('rec')};rec.onerror=()=>toast('خطا در تشخیص گفتار');rec.start();
};
const sendText=()=>{const i=$('#chatIn'),t=i.value.trim();if(t){i.value='';ask([{text:t}],t)}};
$('#sendBtn').onclick=sendText;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')sendText()};

/* ---------- Workout player ---------- */
let pl=null;
function openPlayer(i){const e=MUSCLES[S.muscle][i];pl={name:e[0],sets:e[1],reps:e[2],kcal:e[3],set:1,rest:0,t:null,done:0};drawPlayer()}
function drawPlayer(){
 const p=pl,el=$('#player');el.classList.add('show');
 const dots=`<div class="set-dots">${Array.from({length:p.sets},(_,i)=>`<i class="${i<p.set?'on':''}"></i>`).join('')}</div>`;
 if(p.fin){el.innerHTML=`<div></div><div>${mascot(120)}<h1 style="margin-top:12px">آفرین!</h1><p class="mute" style="color:#aaa">${fa(p.done)} کیلوکالری سوزاندی</p></div><button class="btn" id="plSave">ثبت و خروج</button>`;$('#plSave').onclick=()=>{TOOLS.log_workout({name:p.name,sets:p.sets,reps:p.reps,calories_burned:p.done});save();closePlayer();toast('تمرین ثبت شد');render()};return}
 if(p.rest>0){el.innerHTML=`<button data-x style="align-self:flex-start;color:#aaa">${I('x')}</button><div><p style="color:#aaa">استراحت</p><div class="timer">${fa(p.rest)}</div>${dots}</div><button class="btn" id="plSkip">رد کردن استراحت</button>`;
  $('#plSkip').onclick=()=>{clearInterval(p.t);p.rest=0;drawPlayer()}}
 else{el.innerHTML=`<button data-x style="align-self:flex-start;color:#aaa">${I('x')}</button><div><p style="color:#aaa">${p.name}</p><div class="timer" style="font-size:64px">ست ${fa(p.set)} از ${fa(p.sets)}</div><p style="margin:12px 0 18px;color:#ccc">${fa(p.reps)} تکرار</p>${dots}</div><button class="btn" id="plDone">ست تمام شد</button>`;
  $('#plDone').onclick=()=>{p.done+=Math.round(p.kcal/p.sets*10)/10;if(p.set>=p.sets){p.done=Math.round(p.done);p.fin=true;drawPlayer();return}
   p.set++;p.rest=30;drawPlayer();p.t=setInterval(()=>{p.rest--;if(p.rest<=0){clearInterval(p.t);p.rest=0;navigator.vibrate&&navigator.vibrate(200)}drawPlayer()},1000)}}
 const x=el.querySelector('[data-x]');if(x)x.onclick=closePlayer;
}
function closePlayer(){if(pl)clearInterval(pl.t);pl=null;$('#player').classList.remove('show')}

/* ---------- Forms & sheet ---------- */
const sheet=o=>{$('#sheet').classList.toggle('show',o);$('#ov').classList.toggle('show',o)};
function form(title,fields,cb){
 $('#formBox').innerHTML=`<h3>${title}</h3>${fields.map(f=>`<input type="${f[2]||'text'}" id="f_${f[0]}" placeholder="${f[1]}" style="direction:rtl;text-align:right">`).join('')}<div class="row"><button class="pill" id="fOk">ثبت</button><button class="pill light" id="fNo">انصراف</button></div>`;
 $('#formModal').classList.add('show');
 $('#fNo').onclick=()=>$('#formModal').classList.remove('show');
 $('#fOk').onclick=()=>{const v={};fields.forEach(f=>v[f[0]]=$('#f_'+f[0]).value);$('#formModal').classList.remove('show');cb(v);save();render()};
}
const num=(t,k,l)=>form(t,[['v',l,'number']],v=>{if(v.v!=='')S[k]=+v.v});

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,.overlay');if(!t)return;
 if(t.id==='ov'){sheet(false);return}
 const d=t.dataset;
 if(d.nav){if(d.nav==='plus')sheet(!$('#sheet').classList.contains('show'));else{page=d.nav;render();scrollTo(0,0)}return}
 if(d.muscle){S.muscle=d.muscle;render();return}
 if(d.ex!==undefined){openPlayer(+d.ex);return}
 if(d.water){S.water=Math.max(0,S.water+ +d.water);save();render();return}
 const a=d.act;if(!a)return;
 if(a==='start'){page='workout';render()}
 else if(a==='fast'){S.fastStart=S.fastStart?null:Date.now();save();render()}
 else if(a==='dark'){S.dark=!S.dark;save();render()}
 else if(a==='sex')fld('جنسیت','sex','پسر یا دختر','text');
 else if(a==='age')fld('سن','age','سال');
 else if(a==='height')fld('قد','height','سانتی‌متر');
 else if(a==='weight')fld('وزن فعلی','weight','کیلوگرم');
 else if(a==='steps')fld('هدف قدم روزانه','steps','تعداد قدم');
 else if(a==='name')fld('نام گردولک','name','نام','text');
 else if(a==='tour')tour(0);
 else if(a==='food-text'){sheet(false);form('توضیح غذا',[['t','مثلاً: دو تخم‌مرغ و یک نان سنگک']],v=>{if(v.t)ask([{text:'این غذا را ثبت کن: '+v.t+' . کالری و ماکروها را تخمین بزن و با log_food ثبت کن.'}],v.t)})}
 else if(a==='key'){$('#keyIn').value=getKey();$('#keyModal').classList.add('show')}
 else if(a==='goal')num('هدف کالری','goal','کیلوکالری در روز');
 else if(a==='wgoal')num('هدف آب','waterGoal','میلی‌لیتر در روز');
 else if(a==='wk')num('هدف هفتگی','weeklyGoal','تعداد تمرین در هفته');
 else if(a==='tts'){localStorage.tts=localStorage.tts==='0'?'1':'0';render()}
 else if(a==='reset'){if(confirm('همه داده‌ها پاک شود؟ کلید API حفظ می‌شود.')){localStorage.removeItem(KEY);location.reload()}}
 else if(a==='log-workout'){sheet(false);form('ثبت تمرین',[['n','نام حرکت'],['s','ست','number'],['r','تکرار','number'],['c','کالری سوخته','number']],v=>{TOOLS.log_workout({name:v.n||'تمرین',sets:v.s,reps:v.r,calories_burned:v.c||0});toast('تمرین ثبت شد')})}
 else if(a==='log-food'){sheet(false);form('ثبت غذا',[['n','نام غذا'],['c','کالری','number'],['p','پروتئین (گرم)','number'],['k','کربوهیدرات (گرم)','number'],['f','چربی (گرم)','number']],v=>{TOOLS.log_food({name:v.n||'غذا',calories:v.c||0,protein:v.p||0,carbs:v.k||0,fat:v.f||0});toast('غذا ثبت شد')})}
 else if(a==='food-photo'){sheet(false);$('#imgIn').click()}
 else if(a==='video'){sheet(false);$('#vidIn').click()}
});
$('#keySave').onclick=()=>{localStorage.setItem('gemini_api_key',$('#keyIn').value.trim());$('#keyModal').classList.remove('show');toast('کلید ذخیره شد')};
$('#keyClose').onclick=()=>$('#keyModal').classList.remove('show');
setInterval(()=>{if(page==='food'&&S.fastStart&&!document.activeElement?.matches('input'))render()},60000);
render();

/* ---------- Gravl 2 launch: splash + offline ---------- */
(function(){
 const sp=document.createElement('div');sp.id='splash';
 sp.innerHTML=`<div>${mascot(140)}<h1 style="margin-top:14px">Gravl 2</h1></div>`;document.body.appendChild(sp);
 setTimeout(()=>sp.classList.add('hide'),1100);setTimeout(()=>sp.remove(),1700);
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
if(!S.toured)setTimeout(()=>tour(0),1900);
</script>
</body>
